<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestra Boda</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="portada">
    <div class="carta-scene" id="carta-scene">
      <div class="carta-flip" id="carta-flip">

        <!-- FRENTE: sobre cerrado -->
        <div class="carta-cara carta-frente">
          <div class="sobre-estampilla">
            <div class="estampilla-borde">
              <span class="script" style="font-size:.9rem;color:var(--dorado)">J &amp; D</span>
              <span style="font-size:.55rem;letter-spacing:.1em;color:var(--tinta-suave);margin-top:2px">2027</span>
            </div>
          </div>
          <div class="sobre-matasellos">
            <div class="matasellos-lineas"></div>
          </div>
          <p class="carta-familia serif" id="carta-familia">Familia</p>
          <p class="carta-voltear suave">Toca para abrir</p>
        </div>

        <!-- REVERSO: formulario login -->
        <div class="carta-cara carta-reverso">
          <div class="fecha" data-boda="fechaTexto"></div>
          <h1 class="nombres script"><span data-boda="novio"></span> &amp; <span data-boda="novia"></span></h1>
          <div class="adorno">✦</div>
          <p class="suave">Ingresa con el usuario y la clave que te enviamos por WhatsApp para ver tu invitación.</p>

          <form id="form-login" autocomplete="on">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" autocapitalize="none" autocomplete="username" required>
            <label for="clave">Clave</label>
            <input type="password" id="clave" autocomplete="current-password" required>
            <button class="boton" type="submit">Abrir invitación</button>
            <div id="mensaje" class="mensaje" role="alert"></div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    llenarTextos();

    const params = new URLSearchParams(location.search);
    const paramU = params.get("u");
    if (paramU) {
      document.getElementById("usuario").value = paramU;
      sb.rpc("apellido_por_usuario", { p_usuario: paramU }).then(({ data }) => {
        if (data) document.getElementById("carta-familia").textContent = "Familia " + data;
      });
    }

    // Voltear carta
    const scene = document.getElementById("carta-scene");
    const flip = document.getElementById("carta-flip");
    document.querySelector(".carta-frente").addEventListener("click", () => {
      flip.classList.add("volteada");
    });

    async function redirigirSiHaySesion() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      const { data } = await sb.from("familias").select("es_admin").eq("user_id", session.user.id).single();
      if (data) location.href = data.es_admin ? "admin.html" : "invitacion.html";
    }
    redirigirSiHaySesion();

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("mensaje");
      const boton = e.target.querySelector("button");
      msg.textContent = "";
      msg.className = "mensaje";
      boton.disabled = true;
      try {
        await iniciarSesion(
          document.getElementById("usuario").value,
          document.getElementById("clave").value
        );
        scene.classList.add("abierto");
        setTimeout(() => {
          scene.classList.add("salir");
          setTimeout(() => redirigirSiHaySesion(), 800);
        }, 1800);
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add("error");
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
