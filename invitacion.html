<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Invitación</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="barra">
    <span id="barra-familia"></span>
    <button type="button" onclick="cerrarSesion()">Salir</button>
  </div>

  <header class="hero">
    <p class="saludo" id="saludo"></p>
    <p class="suave contenedor" data-boda="frase"></p>
    <h1 class="nombres script"><span data-boda="novio"></span> &amp; <span data-boda="novia"></span></h1>
    <div class="fecha" data-boda="fechaTexto"></div>
    <div class="cupos" id="cupos"></div>
    <div class="cuenta" id="cuenta"></div>
    <img class="foto-portada" id="foto-portada" alt="Johan y Dankaly">
  </header>

  <main class="contenedor">
    <section class="bloque centro">
      <h2>Dónde y cuándo</h2>
      <div class="lugares">
        <div class="lugar">
          <h3 data-boda="lugar.nombre"></h3>
          <div class="hora" data-boda="lugar.hora"></div>
          <p class="suave" data-boda="lugar.direccion"></p>
          <a class="boton secundario pequeno" data-boda-href="lugar.mapa" target="_blank" rel="noopener">Ver mapa</a>
        </div>
      </div>
    </section>

    <section class="bloque centro" id="galeria-bloque">
      <h2>Nuestra historia</h2>
      <div class="galeria" id="galeria"></div>
    </section>

    <section class="bloque centro">
      <h2>Código de vestimenta</h2>
      <p class="script" style="font-size:2.2rem;color:var(--tinta)" data-boda="dressCode"></p>
      <p class="suave" data-boda="dressCodeNota"></p>
    </section>

    <section class="bloque centro">
      <h2>Regalos</h2>
      <p data-boda="regalos"></p>
    </section>

    <section class="bloque" id="confirmar">
      <h2 class="centro">Confirma tu asistencia</h2>
      <p class="centro suave">Por favor confírmanos antes del <b data-boda="fechaLimiteTexto"></b>.</p>

      <form class="rsvp" id="form-rsvp">
        <label>¿Nos acompañarán?</label>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="asiste" value="si" required> Sí, ¡ahí estaremos!</label>
          <label class="opcion"><input type="radio" name="asiste" value="no"> No podremos asistir</label>
        </div>

        <div id="campos-si" class="oculto">
          <label for="cantidad">¿Cuántas personas asistirán?</label>
          <select id="cantidad"></select>

          <label>Nombre de cada asistente</label>
          <div class="nombres-asistentes" id="nombres"></div>

          <label for="restricciones">Restricciones alimentarias o alergias</label>
          <input type="text" id="restricciones" placeholder="Ej: 1 vegetariano, alergia al maní">
        </div>

        <label for="mensaje-novios">Mensaje para los novios (opcional)</label>
        <textarea id="mensaje-novios" maxlength="1000"></textarea>

        <div class="centro">
          <button class="boton" type="submit" id="btn-enviar">Enviar confirmación</button>
          <div id="mensaje" class="mensaje" role="status"></div>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div class="adorno">✦</div>
    <p class="script" style="font-size:1.8rem;color:var(--dorado)"><span data-boda="novio"></span> &amp; <span data-boda="novia"></span></p>
    <p data-boda="hashtag"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/invitacion.js"></script>
</body>
</html>
